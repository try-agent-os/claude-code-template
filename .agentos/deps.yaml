# Extra binaries manifest. The node installs these at boot, on top of the
# base image: each entry is downloaded, verified against sha256, and (if
# archived) unpacked to dest. Add a binary here when a skill or workflow
# needs a CLI tool the base image doesn't already carry.

version: 1

binaries: []

