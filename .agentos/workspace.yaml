# Managed-repos manifest. This file is read by a `workspace-bootstrap` routine,
# which is NOT shipped in this template — add one to `.agentos/routines/` if you
# want clones kept up to date automatically. The core itself does not read this
# file. Clones are gitignored; only this manifest is committed.

version: 1

repos: []

# Example entry (uncomment and adjust):
# repos:
#   - name: my-project
#     url: https://github.com/<owner>/my-project.git
#     branch: main
#     path: workspace/my-project
