# Example routine. To enable it, copy this file into .agentos/routines/ and
# adjust the cron, timezone, and prompt to taste — the node picks it up on
# the next repo sync.

name: morning-brief
description: Weekday morning summary of the day ahead, sent as a short brief.

on:
  schedule:
    cron: "0 8 * * 1-5"
    timezone: Europe/Lisbon
    catch_up: run_once

steps:
  - name: brief
    # `operator` delivers into the conversation you are already having, so the
    # brief arrives as a message. The default, `isolated`, runs the step in a
    # session of its own and leaves the result in the run log — right for a
    # routine that only needs to do work, wrong for one whose whole point is
    # to tell you something.
    agent:
      session: operator
      prompt: |
        Prepare a short morning brief. Start by reading memory/ for context
        (owner profile, people, open threads) before pulling anything live.

        Cover, in order, and skip a section if it's empty:
        - Today's calendar: time and title for each meeting.
        - Open tasks that are urgent or due today.
        - People who replied or were owed a reply more than 24h ago and
          haven't been followed up on.

        Keep the whole brief under 15 lines. No filler, no restating the
        date twice, no section headers for empty sections.
