# integration-liveness — probe your integrations' credentials and surface dead
# ones BEFORE an agent silently 403s / returns empty on them.
#
# WHY: credential decay is the most common recurring failure in an always-on
# fleet — tokens expire, keys get rotated or revoked server-side, a re-consent
# silently drops a scope. The failure is SILENT: the routine that depends on the
# dead credential just returns 403 or empty, and nobody notices for days. A task
# can even be marked DONE while its credential was dead the whole time.
#
# WHAT IT DOES: runs the probes declared in .integration-liveness.json, writes a
# manifest at /var/lib/agent-os/integration-liveness.json (other consumers — a
# morning brief, a watchdog — read it instead of re-probing), and exits non-zero
# ONLY when the dead-set GROWS versus the previous run. A chronically-dead
# integration does not re-alert every run: repeated alarms get ignored, which is
# exactly how a dead credential survives. State CHANGES are what you want to see.
#
# SETUP: copy .integration-liveness.example.json -> .integration-liveness.json and
# declare your integrations (http / command / command_json / not_probed). Secrets
# are never stored in the config — only the NAME of the env var holding each one.
# With no config the routine exits 0 and does nothing.
#
# Cadence: twice daily. Same-day decay (an expiring OAuth token) is caught within
# hours, and the probe is cheap — a handful of auth-only API calls.
name: integration-liveness
description: Twice daily — probe the live status of your integration credentials (tokens, API keys, OAuth scopes) and alert when one newly goes dead, with the one-line remediation. Writes a manifest other routines can read. No-op until .integration-liveness.json is configured.
tags:
  - script
  - infra
  - periodic
  - safety
schedule: "0 6,18 * * *"
timeout_sec: 120
max_active_runs: 1
steps:
  - name: probe
    command: /bin/bash /opt/agent-os/claude/scripts/integration-liveness.sh
    working_dir: /opt/agent-os/claude
