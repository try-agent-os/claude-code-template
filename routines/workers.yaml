# workers — launch the next interactive worker from the task queue.
#
# Token-free (pure bash + Python, no LLM). Replaces the old LLM dispatcher that
# decided-and-launched stream workers each cycle. The launcher picks the top
# pickable todo from the task backend (ClickUp is the reference backend; config
# via CLICKUP_* env), fills the worker prompt template, and spawns ONE
# interactive worker (scripts/spawn-worker.sh). Workers update the task status
# directly via the backend API and self-finalize via the /done and /blocked
# slash commands.
#
# The orphan sweep lives in worker-supervisor.sh (*/1), which frees stuck slots
# up to a minute BEFORE this launch tick runs — so no collect→launch ordering is
# needed. The launcher keeps its own tmux has-session idempotency, so a freshly
# released slug is never double-launched.
name: workers
description: Worker lifecycle — launch the next interactive worker from the top pickable todo. Orphan sweep lives in worker-supervisor. Runs every 5 min.
tags:
  - agent
  - core
schedule: "*/5 * * * *"
timeout_sec: 180
max_active_runs: 3
# HOME / CLAUDE_CONFIG_DIR / TMUX_TMPDIR are host-specific and provided at the
# Dagu PROCESS level by agent-os-dagu.service (so the routine stays portable);
# they are NOT set here. CLAUDE_CONFIG_DIR points workers at the OAuth
# credential store — without it the launcher fallback can resolve to a store
# whose token has expired and all workers 401.
env:
  - MCP_CONNECTION_NONBLOCKING: "true"
  - DISABLE_AUTOUPDATER: "1"
  # CLAUDECODE=1 — signal to the CLI that it's being invoked programmatically.
  - CLAUDECODE: "1"
steps:
  - name: launch
    command: /bin/bash /opt/agent-os/claude/scripts/worker-launcher-tick.sh
    working_dir: /opt/agent-os/claude
