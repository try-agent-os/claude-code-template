# pr-leak-scan — deterministic secret/PII gate over OPEN PRs in your PUBLIC repos.
#
# WHY: when an agent (or a teammate, or a fork) opens a PR into a public repo, an
# added line can carry a credential or the operator's personal data. Once pushed
# it is public and stays in the history — removing the line later does not undo
# the leak. So the gate must run BEFORE a merge, and it must be deterministic:
# same diff in, same verdict out, no model in the loop.
#
# WHAT IT DOES: scripts/pr-leak-scan-fire.sh lists open PRs in the PUBLIC repos you
# watch and runs scripts/pr-leak-scan.sh on each diff (added lines only — a removed
# line is leaving the repo and is never a leak). LEAK (exit 2) or REVIEW (exit 3)
# -> a sanitised comment on the PR (credential values masked) + a non-zero exit so
# your failure handler alerts. CLEAN -> silent. It NEVER merges or closes anything;
# reporting only. Comments are idempotent per head SHA, so re-runs stay quiet until
# a new commit lands.
#
# SETUP: copy .pr-leak-scan.example.json -> .pr-leak-scan.json, fill in YOUR names/
# domains/hosts, and set `watch.org` (or watch.repos) to the org whose public repos
# this should sweep. With no config the routine exits 0 and does nothing — built-in
# secret patterns still work, but it has no repos to look at.
#
# Cadence: every 30 min. Cheap when idle (a few `gh` calls), and a PR usually sits
# open longer than that, so the gate lands before a human gets to the merge button.
name: pr-leak-scan
description: Every 30 min — deterministic secret/PII leak gate over open PRs in your public repos. Scans added lines with scripts/pr-leak-scan.sh, comments sanitised findings on LEAK/REVIEW, exits non-zero to alert. Never merges. No-op until .pr-leak-scan.json is configured.
tags:
  - script
  - periodic
  - pr-gate
  - safety
schedule: "*/30 * * * *"
timeout_sec: 300
max_active_runs: 1
steps:
  - name: scan-open-prs
    command: /bin/bash /opt/agent-os/claude/scripts/pr-leak-scan-fire.sh
    working_dir: /opt/agent-os/claude
