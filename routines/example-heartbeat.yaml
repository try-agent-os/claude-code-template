# example-heartbeat — a minimal, self-contained sample DAG.
#
# Copy this file to routines/<your-name>.yaml, change the `schedule` and
# `steps`, then validate with:  dagu dry example-heartbeat
# (or `scripts/dagu-run.sh example-heartbeat` to fire one run immediately).
#
# The scheduler (agent-os-dagu.service) auto-discovers every *.yaml in this
# directory (DAGU_DAGS_DIR) and re-reads on the next tick — no restart needed
# after editing.
#
# DAG YAML reference: https://docs.dagu.cloud/
name: example-heartbeat
description: Minimal example DAG — runs every 15 min, demonstrates schedule + a couple of steps.
tags:
  - example
# Cron 5-field: minute hour day-of-month month day-of-week.
schedule: "*/15 * * * *"
# Only one run at a time; a concurrent trigger is a no-op.
max_active_runs: 1
steps:
  - name: greet
    command: echo "hello from the example DAG at $(date -u +%H:%M:%SZ)"
  - name: show-host
    # Steps run sequentially by default; this one starts after `greet` succeeds.
    command: uname -a
