# repo-sync — pull origin/main into this instance's checkout so commits pushed
# from anywhere else (a dev laptop, a merged worker branch) actually deploy here.
#
# WHY a short schedule: this is the deploy plane. Everything else in the fleet
# assumes "pushed to main" == "running". That equality holds only as often as
# this DAG runs.
#
# WHY it can exit non-zero: a wedged sync is the failure you must never swallow.
# The script quarantines untracked collisions and retries, but if the checkout
# is still behind (rebase conflict, wedged rebase state) it exits 1 so this run
# goes RED instead of reporting a green lie while nothing deploys.
name: repo-sync
description: Every 5 min — git pull --rebase --autostash on the instance checkout, with untracked-collision self-heal and a staleness guard that fails the run when the deploy plane is wedged.
tags:
  - script
  - infra
  - periodic
schedule: "*/5 * * * *"
timeout_sec: 60
max_active_runs: 1
steps:
  - name: pull
    command: /bin/bash /opt/agent-os/claude/scripts/repo-sync.sh
    working_dir: /opt/agent-os/claude
