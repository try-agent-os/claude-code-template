# strategist — analytical worker.
#
# Reads signals/opportunities/patterns + the task queue, does pattern
# decay/boost, hunts recurring failures in memory/worker-errors/*.log and the
# worker-activity logs, and decides what new tasks to create. Runs as a regular
# tmux worker via spawn-worker.sh, so this DAG just kicks off strategist.sh and
# returns; the worker itself lives ~30-45 min.
#
# strategist.sh has its own /tmp lock and spawn-worker.sh has tmux-session
# idempotency, so overlapping fires are safe.
#
# Cadence: daily (adjust to taste). Set the Dagu process TZ if you want a local
# hour; the cron below is interpreted in the scheduler's timezone.
name: strategist
description: Strategist — analyze signals/opportunities/patterns/workers, propose tasks, decay/boost patterns. ~30-45 min per cycle. Daily.
tags:
  - agent
  - strategist
schedule: "0 5 * * *"
timeout_sec: 120                # only times the launch, not the worker
max_active_runs: 1
env:
  # HOME / CLAUDE_CONFIG_DIR provided at the Dagu PROCESS level
  # (agent-os-dagu.service), host-specific — NOT set here (portability).
  - MCP_CONNECTION_NONBLOCKING: "true"
  - DISABLE_AUTOUPDATER: "1"
steps:
  - name: launch
    command: /bin/bash /opt/agent-os/claude/agents/heartbeat/strategist.sh
    working_dir: /opt/agent-os/claude/agents/heartbeat
