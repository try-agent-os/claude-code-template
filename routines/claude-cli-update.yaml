# claude-cli-update — keep the Claude Code CLI current on the hub, SAFELY.
#
# Runs the STOCK updater (`claude update` — native installer; symlink flips to a
# new versions/<NEW> binary). Already-running operator/worker processes keep
# their open inode and are NOT disrupted; only new spawns pick up the new build.
# This routine does NOT restart any service.
#
# SAFETY (handled by the script): when the version actually changes it
#   1) re-applies the DevChannelsDialog binary patch (a fresh CC build brings the
#      blocking "WARNING: Loading development channels" prompt back — headless
#      spawns would hang on it), via the idempotent ensure-dev-channels-patch.py;
#   2) verifies /etc/claude-code/managed-settings.json is present + valid JSON;
#   3) verifies the new binary runs (`claude --version`).
# On a real update or any error it pings the operator (notify-operator.sh).
# Clean no-op (already latest) is silent. Script always exits 0 (non-blocking).
#
# Low-activity window: 04:00 host time, daily.
name: claude-cli-update
description: Daily safe auto-update of the Claude Code CLI (stock `claude update`) + re-apply dev-channels patch + verify managed-settings.
tags:
  - script
  - infra
schedule: "0 4 * * *"
timeout_sec: 300
max_active_runs: 1
# HOME is host-specific and provided at the Dagu PROCESS level
# (agent-os-dagu.service) — not set here, so the routine stays portable.
steps:
  - name: update-cli
    command: /bin/bash /opt/agent-os/claude/scripts/claude-cli-update.sh
    working_dir: /opt/agent-os/claude
