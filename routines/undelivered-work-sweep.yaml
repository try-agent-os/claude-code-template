# undelivered-work-sweep — did the fleet's work actually land on origin/main?
#
# Why: workers push a branch, comment `outcome: done | score: 5/5`, flip the
# task to in_review and kill their tmux session — and the commits never reach
# main. Measured on a live install over a trailing 7 days: 30 files created by
# workers existed on no branch that main could see, including four meeting
# debriefs, five proposals that therefore never entered the strategist's review
# queue, and an entire liveness guard. Every existing monitor was green
# throughout: health-watchdog crash_rate≈0, drain-doctor "drainable",
# unit-supervision clean, skill-reference-check dangling=0 — the last one
# precisely BECAUSE each lost change lost its doc half and its code half
# together, leaving no dangling reference to find.
#
# One known mechanism is a reused worktree path reset onto origin/main, which
# orphans the previous tick. This sweep deliberately does not model the
# mechanism — it measures the outcome, so a NEW way of losing work is caught by
# the same probe.
#
# Gates on lost_files (a file-add absent from main; a squash-merge cannot hide
# one). orphan_commits is reported but never gated — squashing a multi-commit
# branch legitimately changes patch-ids.
name: undelivered-work-sweep
description: Reconcile pushed worker branches against origin/main and alert when worker output never landed — the "green /done, empty main" failure class.
tags:
  - script
  - infra
schedule: "30 6 * * *"
timeout_sec: 900
max_active_runs: 1
# Idempotent monitoring routine: a retry is pointless — the next run rechecks
# anyway, and on a non-zero exit (= findings exist) a retry re-runs the sweep
# for nothing and risks a duplicate alert. Alert dedup lives in the script
# itself (growing set of lost files vs the manifest).
retry_policy:
  limit: 0
steps:
  - name: sweep
    command: /usr/bin/python3 /opt/agent-os/claude/scripts/undelivered-work-sweep.py
    working_dir: /opt/agent-os/claude
    continue_on:
      # exit 1 = findings exist and the script already notified the operator;
      # that is a working outcome of the routine, not a step failure. The DAG
      # should go red only on exit 2 (git plumbing broken = the probe is blind).
      exit_code: [1]
