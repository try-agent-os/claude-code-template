<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentOS — Task Dashboard</title>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a32;
    --text: #e2e2e8;
    --muted: #6b6b7a;
    --accent: #7c6ef5;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --orange: #f97316;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Layout */
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
  .header-meta { display: flex; gap: 12px; align-items: center; }
  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .refresh-btn:hover { background: var(--accent); border-color: var(--accent); }
  .last-update { font-size: 11px; color: var(--muted); }
  .spinner { display: none; }
  .loading .spinner { display: inline; }

  .main { padding: 16px 20px; max-width: 1200px; margin: 0 auto; }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(3, 1fr); }
    .stats-row .stat:last-child { grid-column: span 3; }
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
  }
  .stat-value { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat.total .stat-value { color: var(--accent); }
  .stat.done .stat-value { color: var(--green); }
  .stat.blocked .stat-value { color: var(--red); }
  .stat.in_progress .stat-value { color: var(--yellow); }
  .stat.todo .stat-value { color: var(--blue); }

  /* Sections */
  .section { margin-bottom: 24px; }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
  .filter-label { font-size: 11px; color: var(--muted); align-self: center; margin-right: 2px; }
  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Epics */
  .epic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .epic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .epic-card:hover { border-color: var(--accent); }
  .epic-card.active-filter { border-color: var(--accent); background: #7c6ef510; }
  .epic-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
  .epic-stats { display: flex; gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .epic-stats span { display: flex; align-items: center; gap: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-yellow { background: var(--yellow); }
  .dot-blue { background: var(--blue); }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 2px;
    transition: width 0.4s;
  }
  .epic-pct { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }

  /* Task list */
  .task-list { display: flex; flex-direction: column; gap: 4px; }
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: border-color 0.15s;
  }
  .task-item:hover { border-color: var(--border); background: var(--surface2); }
  .task-item.blocked { border-left: 3px solid var(--red); }
  .task-item.in_progress { border-left: 3px solid var(--yellow); }
  .task-item.todo { border-left: 3px solid var(--blue); }
  .task-item.done { border-left: 3px solid var(--green); opacity: 0.6; }
  .task-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .task-content { flex: 1; min-width: 0; }
  .task-title {
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }
  .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 500;
  }
  .badge-epic { background: #7c6ef520; color: var(--accent); }
  .badge-priority-critical { background: #ef444420; color: var(--red); }
  .badge-priority-high { background: #f9731620; color: var(--orange); }
  .badge-priority-medium { background: #3b82f620; color: var(--blue); }
  .badge-priority-low { background: #6b6b7a30; color: var(--muted); }

  /* Activity */
  .activity-list { display: flex; flex-direction: column; gap: 2px; }
  .activity-item {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .activity-time { color: var(--muted); white-space: nowrap; min-width: 120px; flex-shrink: 0; }
  .activity-text { color: var(--text); flex: 1; }

  /* Blocked section */
  .blocked-list { display: flex; flex-direction: column; gap: 4px; }
  .blocked-item {
    background: #ef444410;
    border: 1px solid #ef444430;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .blocked-icon { color: var(--red); font-size: 14px; flex-shrink: 0; }
  .blocked-title { font-size: 13px; flex: 1; }
  .blocked-epic { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Empty */
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; text-align: center; }

  /* No tasks shown */
  #task-count-info { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; margin-bottom: 16px; background: var(--surface); border-radius: 8px; padding: 3px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.15s;
  }
  .tab.active { background: var(--accent); color: #fff; }
  .tab:hover:not(.active) { color: var(--text); }

  /* Collapsed section */
  .collapsible { cursor: pointer; user-select: none; }
  .collapsible::after { content: ' ▾'; font-size: 10px; }
  .collapsible.collapsed::after { content: ' ▸'; }
  .collapse-content.hidden { display: none; }

  /* Scrollable task list */
  .task-list-scroll { max-height: 500px; overflow-y: auto; padding-right: 4px; }
  .task-list-scroll::-webkit-scrollbar { width: 4px; }
  .task-list-scroll::-webkit-scrollbar-track { background: var(--surface); }
  .task-list-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid-two { grid-template-columns: 1fr; } }

  /* Task detail modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: min(700px, 95vw); max-height: 85vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  .modal-header h2 { font-size: 16px; font-weight: 600; flex: 1; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 16px 20px; }
  .detail-row { margin-bottom: 14px; }
  .detail-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .detail-value { font-size: 13px; }
  .detail-value pre { white-space: pre-wrap; font-family: inherit; color: var(--text); line-height: 1.6; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .detail-grid .detail-row { margin-bottom: 0; }
  .dep-link { color: var(--accent); cursor: pointer; text-decoration: none; }
  .dep-link:hover { text-decoration: underline; }
  .subtask-item { padding: 4px 0; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .subtask-check { color: var(--green); }
  .subtask-pending { color: var(--muted); }
  .tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; color: var(--muted); }
  .task-item { cursor: pointer; }
  .task-item:hover { background: var(--surface2); }
</style>
</head>
<body>
<div class="header">
  <h1>⚡ AgentOS Dashboard</h1>
  <div class="header-meta">
    <span class="last-update" id="last-update">loading...</span>
    <button class="refresh-btn" onclick="load()">↻ Refresh</button>
  </div>
</div>

<div class="main" id="main">
  <div class="empty">Loading data...</div>
</div>

<script>
const API_BASE = '';  // relative — server.js proxies to saga-mcp
const API = '/api/dashboard';
let state = { data: null, epicFilter: null, statusFilter: 'all', priorityFilter: 'all', selectedTask: null };

function statusColor(s) {
  return { done: 'var(--green)', blocked: 'var(--red)', in_progress: 'var(--yellow)', todo: 'var(--blue)', review: 'var(--orange)' }[s] || 'var(--muted)';
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + (iso.includes('T') ? '' : 'Z'));
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  if (diff < 604800000) return Math.floor(diff/86400000) + 'd ago';
  return d.toLocaleDateString('en-US');
}

function render(data) {
  const epics = data.epics || [];
  const tasks = data.tasks || [];
  const activity = data.recent_activity || data.activity || [];
  const raw = data.stats || {};
  const stats = {
    total: raw.total_tasks || raw.total || 0,
    done: raw.tasks_done || raw.done || 0,
    in_progress: raw.tasks_in_progress || raw.in_progress || 0,
    blocked: raw.tasks_blocked || raw.blocked || 0,
    todo: raw.tasks_todo || raw.todo || 0,
  };

  const filteredTasks = tasks.filter(t => {
    if (state.epicFilter && t.epic_id !== state.epicFilter) return false;
    if (state.statusFilter !== 'all' && t.status !== state.statusFilter) return false;
    if (state.priorityFilter !== 'all' && t.priority !== state.priorityFilter) return false;
    return true;
  });

  const blocked = tasks.filter(t => t.status === 'blocked');
  const inProgress = tasks.filter(t => t.status === 'in_progress');

  const html = `
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat total"><div class="stat-value">${stats.total}</div><div class="stat-label">Total</div></div>
      <div class="stat done"><div class="stat-value">${stats.done}</div><div class="stat-label">Done</div></div>
      <div class="stat in_progress"><div class="stat-value">${stats.in_progress}</div><div class="stat-label">In Progress</div></div>
      <div class="stat blocked"><div class="stat-value">${stats.blocked}</div><div class="stat-label">Blocked</div></div>
      <div class="stat todo"><div class="stat-value">${stats.todo}</div><div class="stat-label">Queue</div></div>
    </div>

    <!-- Blocked & In Progress alert -->
    ${blocked.length > 0 || inProgress.length > 0 ? `
    <div class="section">
      <div class="section-title collapsible" onclick="toggleSection(this)">🚨 Needs Attention</div>
      <div class="collapse-content">
        ${inProgress.map(t => `
          <div class="task-item in_progress" style="margin-bottom:4px">
            <div class="task-status-dot" style="background:var(--yellow)"></div>
            <div class="task-content">
              <div class="task-title">${esc(t.title)}</div>
              <div class="task-meta">
                <span class="badge badge-epic">${esc(t.epic_name)}</span>
                <span class="badge badge-priority-${t.priority}">${t.priority}</span>
                <span style="font-size:10px;color:var(--muted)">updated ${fmtDate(t.updated_at)}</span>
              </div>
            </div>
          </div>`).join('')}
        ${blocked.map(t => `
          <div class="blocked-item">
            <div class="blocked-icon">⛔</div>
            <div>
              <div class="blocked-title">${esc(t.title)}</div>
              <div class="blocked-epic">${esc(t.epic_name)} · ${t.priority}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Epics -->
    <div class="section">
      <div class="section-title">Epics</div>
      <div class="epic-grid">
        ${epics.map(e => {
          const eTasks = tasks.filter(t => t.epic_id === e.id);
          const eIP = eTasks.filter(t => t.status === 'in_progress').length;
          const eTodo = eTasks.filter(t => t.status === 'todo').length;
          return `
          <div class="epic-card ${state.epicFilter === e.id ? 'active-filter' : ''}" onclick="toggleEpic(${e.id})">
            <div class="epic-name">${esc(e.name)}</div>
            <div class="epic-stats">
              <span><span class="dot dot-green"></span>${e.done_count} done</span>
              ${e.blocked_count > 0 ? `<span><span class="dot dot-red"></span>${e.blocked_count} blocked</span>` : ''}
              ${eIP > 0 ? `<span><span class="dot dot-yellow"></span>${eIP} active</span>` : ''}
              ${eTodo > 0 ? `<span><span class="dot dot-blue"></span>${eTodo} todo</span>` : ''}
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${e.completion_pct}%"></div>
            </div>
            <div class="epic-pct">${e.completion_pct}%</div>
          </div>`; }).join('')}
      </div>
    </div>

    <!-- Filters -->
    <div class="section">
      <div class="section-title">Tasks</div>
      <div class="filters">
        <span class="filter-label">Status:</span>
        <div class="filter-group">
          ${['all','todo','in_progress','blocked','done'].map(s => `
            <span class="chip ${state.statusFilter===s?'active':''}" onclick="setStatus('${s}')">${s==='all'?'All':s}</span>`).join('')}
        </div>
        <span class="filter-label" style="margin-left:8px">Priority:</span>
        <div class="filter-group">
          ${['all','critical','high','medium','low'].map(p => `
            <span class="chip ${state.priorityFilter===p?'active':''}" onclick="setPriority('${p}')">${p==='all'?'All':p}</span>`).join('')}
        </div>
        ${state.epicFilter ? `<span class="chip active" style="margin-left:auto" onclick="toggleEpic(null)">× Clear epic</span>` : ''}
      </div>
      <div id="task-count-info">Showing ${filteredTasks.length} of ${tasks.length} tasks</div>
      <div class="task-list task-list-scroll">
        ${filteredTasks.length === 0 ? '<div class="empty">No tasks match the selected filters</div>' :
          filteredTasks.map(t => `
          <div class="task-item ${t.status}" onclick="openTask(${t.id})">
            <div class="task-status-dot" style="background:${statusColor(t.status)}"></div>
            <div class="task-content">
              <div class="task-title">${esc(t.title)}</div>
              <div class="task-meta">
                <span class="badge badge-epic">${esc(t.epic_name)}</span>
                <span class="badge badge-priority-${t.priority}">${t.priority}</span>
                <span style="font-size:10px;color:var(--muted)">${fmtDate(t.updated_at)}</span>
              </div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <!-- Activity -->
    <div class="section">
      <div class="section-title collapsible" onclick="toggleSection(this)">Activity</div>
      <div class="collapse-content">
        <div class="activity-list">
          ${activity.map(a => `
            <div class="activity-item">
              <span class="activity-time">${fmtDate(a.created_at)}</span>
              <span class="activity-text">${esc(a.summary || a.action + ' ' + a.entity_type + ' #' + a.entity_id)}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;

  document.getElementById('main').innerHTML = html;
  document.getElementById('last-update').textContent = 'updated ' + new Date().toLocaleTimeString('en-US');
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleEpic(id) {
  state.epicFilter = state.epicFilter === id ? null : id;
  render(state.data);
}
function setStatus(s) {
  state.statusFilter = s;
  render(state.data);
}
function setPriority(p) {
  state.priorityFilter = p;
  render(state.data);
}
function toggleSection(el) {
  el.classList.toggle('collapsed');
  el.nextElementSibling.classList.toggle('hidden');
}

async function openTask(id) {
  try {
    const r = await fetch(API_BASE + '/api/task/' + id);
    const task = await r.json();
    state.selectedTask = task;
    renderModal(task);
  } catch(e) {
    alert('Failed to load task: ' + e.message);
  }
}

function renderModal(t) {
  const tags = (() => { try { return JSON.parse(t.tags || '[]'); } catch { return []; } })();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2><span style="color:var(--muted)">#${t.id}</span> ${esc(t.title)}</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="detail-grid">
          <div class="detail-row">
            <div class="detail-label">Status</div>
            <div class="detail-value"><span class="badge" style="background:${statusColor(t.status)};color:#fff;padding:3px 10px">${t.status}</span></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Priority</div>
            <div class="detail-value"><span class="badge badge-priority-${t.priority}">${t.priority}</span></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Epic</div>
            <div class="detail-value">${esc(t.epic_name)}</div>
          </div>
        </div>

        <div class="detail-grid">
          <div class="detail-row">
            <div class="detail-label">Created</div>
            <div class="detail-value">${fmtDate(t.created_at)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Updated</div>
            <div class="detail-value">${fmtDate(t.updated_at)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Time</div>
            <div class="detail-value">${t.actual_hours ? t.actual_hours + 'h' : '—'}${t.estimated_hours ? ' / ' + t.estimated_hours + 'h planned' : ''}</div>
          </div>
        </div>

        ${t.description ? `
        <div class="detail-row">
          <div class="detail-label">Description</div>
          <div class="detail-value"><pre>${esc(t.description)}</pre></div>
        </div>` : ''}

        ${tags.length > 0 ? `
        <div class="detail-row">
          <div class="detail-label">Tags</div>
          <div class="tag-list">${tags.map(tg => `<span class="tag">${esc(tg)}</span>`).join('')}</div>
        </div>` : ''}

        ${t.depends_on && t.depends_on.length > 0 ? `
        <div class="detail-row">
          <div class="detail-label">Depends on</div>
          <div class="detail-value">${t.depends_on.map(d =>
            `<span class="dep-link" onclick="event.stopPropagation();closeModal();openTask(${d.id})">#${d.id} ${esc(d.title)} <span class="badge" style="background:${statusColor(d.status)};color:#fff;font-size:10px;padding:1px 6px">${d.status}</span></span>`
          ).join('<br>')}</div>
        </div>` : ''}

        ${t.dependents && t.dependents.length > 0 ? `
        <div class="detail-row">
          <div class="detail-label">Blocks</div>
          <div class="detail-value">${t.dependents.map(d =>
            `<span class="dep-link" onclick="event.stopPropagation();closeModal();openTask(${d.id})">#${d.id} ${esc(d.title)} <span class="badge" style="background:${statusColor(d.status)};color:#fff;font-size:10px;padding:1px 6px">${d.status}</span></span>`
          ).join('<br>')}</div>
        </div>` : ''}

        ${t.subtasks && t.subtasks.length > 0 ? `
        <div class="detail-row">
          <div class="detail-label">Subtasks (${t.subtasks.filter(s=>s.status==='done').length}/${t.subtasks.length})</div>
          <div class="detail-value">${t.subtasks.map(s =>
            `<div class="subtask-item"><span class="${s.status==='done'?'subtask-check':'subtask-pending'}">${s.status==='done'?'✓':'○'}</span> ${esc(s.title)}</div>`
          ).join('')}</div>
        </div>` : ''}

        ${t.notes && t.notes.length > 0 ? `
        <div class="detail-row">
          <div class="detail-label">Notes</div>
          <div class="detail-value">${t.notes.map(n =>
            `<div style="margin-bottom:8px;padding:8px;background:var(--surface2);border-radius:6px"><div style="font-weight:600;margin-bottom:4px">${esc(n.title)}</div><pre>${esc(n.content)}</pre></div>`
          ).join('')}</div>
        </div>` : ''}

        ${t.comments && t.comments.length > 0 ? `
        <div class="detail-row">
          <div class="detail-label">Comments</div>
          <div class="detail-value">${t.comments.map(c =>
            `<div style="margin-bottom:6px"><span style="color:var(--accent)">${esc(c.author)}</span> <span style="color:var(--muted);font-size:11px">${fmtDate(c.created_at)}</span><div>${esc(c.content)}</div></div>`
          ).join('')}</div>
        </div>` : ''}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escHandler);
}

function closeModal() {
  const overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
  state.selectedTask = null;
  document.removeEventListener('keydown', escHandler);
}

function escHandler(e) { if (e.key === 'Escape') closeModal(); }

async function load() {
  try {
    const [dashR, tasksR] = await Promise.all([
      fetch(API),
      fetch(API_BASE + '/api/tasks?limit=500'),
    ]);
    const dash = await dashR.json();
    const tasks = await tasksR.json();
    dash.tasks = Array.isArray(tasks) ? tasks : [];
    state.data = dash;
    render(state.data);
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty">Load error: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
