name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install --quiet pyyaml yamllint

      - name: yamllint .agentos/ and examples/
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, comments: disable}}" .agentos examples

      - name: cloud-init sanity (pure ASCII + valid YAML)
        # cloud-init's YAML 1.1 parser rejects non-ASCII bytes and then silently
        # skips runcmd — the deploy button "works" but installs nothing.
        run: |
          python3 - <<'PY'
          import sys, yaml
          data = open('cloud-init.yaml','rb').read()
          bad = [i for i, b in enumerate(data) if b > 127]
          if bad:
              print(f"cloud-init.yaml: non-ASCII byte at offset {bad[0]}")
              sys.exit(1)
          yaml.safe_load(data)
          print('cloud-init.yaml ok')
          PY

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import glob, re, sys, yaml

          failed = False
          pattern = re.compile(r"\A---\n(.*?)\n---\n", re.DOTALL)
          for path in glob.glob("**/skills/*/SKILL.md", recursive=True):
              text = open(path).read()
              m = pattern.match(text)
              if not m:
                  print(f"{path}: missing frontmatter")
                  failed = True
                  continue
              data = yaml.safe_load(m.group(1)) or {}
              for key in ("name", "description"):
                  if not data.get(key):
                      print(f"{path}: missing '{key}'")
                      failed = True

          sys.exit(1 if failed else 0)
          PY
