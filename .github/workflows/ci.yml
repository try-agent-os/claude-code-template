name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck (install.sh + agent scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -qq shellcheck
      - name: Lint install.sh
        # SC2155 dynamic export, SC2086 intentional word-splitting,
        # SC1090/SC1091 dynamic source paths, SC2034 fmtted-only vars,
        # SC2001 sed-vs-bashism style preference, SC2088 tilde-in-quotes
        # (literal display strings), SC2029 SSH expand-on-client (intentional),
        # SC2016 single-quoted echo (intentional template strings).
        run: |
          shellcheck --severity=error \
            install.sh uninstall.sh
      - name: Lint agent scripts
        run: |
          shellcheck --severity=error \
            agents/heartbeat/dispatcher.sh \
            agents/operator/start.sh \
            scripts/verify.sh

  json-validate:
    name: JSON validity (config templates + manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -qq jq
      - name: Validate every JSON file
        # Skip tsconfig.json (JSONC — JSON with comments — is valid TypeScript
        # convention but not strict JSON). Skip node_modules subdirs.
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            base=$(basename "$f")
            case "$base" in
              tsconfig.json|tsconfig.*.json) continue ;;
            esac
            if ! jq . "$f" > /dev/null; then
              echo "::error file=$f::Invalid JSON"
              fail=1
            fi
          done < <(find . -path ./node_modules -prune -o \
                          -path '*/node_modules' -prune -o \
                          -name '*.json' -type f -print)
          exit $fail
      - name: Validate marketplace.json schema (basic shape)
        run: |
          jq -e '.id and .name and .plugins and (.plugins | type=="array")' \
            .claude-plugin/marketplace.json
          # Each plugin entry must have name + source string
          jq -e '.plugins | all(.name and (.source|type=="string"))' \
            .claude-plugin/marketplace.json
      - name: Validate plugin manifests have userConfig.title where userConfig present
        run: |
          set -e
          fail=0
          for f in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$f" ] || continue
            if jq -e 'has("userConfig")' "$f" > /dev/null; then
              # Each userConfig field must have a title
              if ! jq -e '.userConfig | to_entries | all(.value | has("title"))' "$f" > /dev/null; then
                echo "::error file=$f::userConfig fields are missing 'title'"
                fail=1
              fi
            fi
          done
          exit $fail

  yaml-validate:
    name: YAML validity (cloud-init + workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint cloud-init
        # Allow long lines + cloud-init's '#cloud-config' comment header
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, comments-indentation: disable}}" \
            cloud-init.yaml
      - name: Lint workflow files
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, truthy: disable}}" \
            .github/workflows/

  smoke-install:
    name: Smoke install (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Smoke prerequisites + bash -n + apt-name compat
        run: |
          # Containers don't run systemd without --privileged, so we don't run
          # the full install. We DO check: syntax, --help works, all apt
          # package names in Step 3 prereqs resolve on this distro.
          apt-get update -qq
          apt-get install -y -qq bash curl
          bash -n install.sh
          bash install.sh --help 2>&1 | head -20 || true

          # Step 3 apt prereqs — verify package names exist on this distro
          # (bubblewrap is missing on Debian 12 by default; that's a known
          # divergence we accept — install.sh degrades gracefully if missing)
          for pkg in curl ca-certificates gnupg git tmux jq sqlite3 \
                     build-essential cmake ffmpeg python3 python3-pip \
                     ufw socat unzip fail2ban; do
            if ! apt-cache show "$pkg" > /dev/null 2>&1; then
              echo "::warning::Package '$pkg' not in apt-cache on ${{ matrix.distro }}"
            fi
          done
          echo "✓ syntax + apt names checked on ${{ matrix.distro }}"
